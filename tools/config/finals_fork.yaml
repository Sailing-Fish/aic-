# AIC 2026 全国决赛 · 岔路 S 图 (5-3m地图岔路S.pdf) 专用配置
# 启用：./tools/start.sh --params finals_fork
line_follower_node:
  ros__parameters:
    image_topic: /image_raw
    cmd_vel_topic: /cmd_vel_follower
    debug_image_topic: line_follower/debug_image
    line_state_topic: line_follower/track_state
    start_topic: line_follower/start_cmd
    stop_cmd_topic: /cmd_vel_stop
    odom_topic: /odom
    ekf_odom_topic: /odom_combined
    detection_topic: hobot_dnn_detection
    detection_timeout_sec: 0.35
    segment_topic: line_follower/segment
    voltage_topic: /PowerVoltage

    # ================================
    # 决赛核心解耦开关（默认启用第一性原理 BEV + 拓扑指南针 + 阿克曼 DWA；支持一键回退 legacy）
    # ================================
    bev_planner_mode: bev_dwa
    # 车道视觉分割模式：relative_border（抗光照/抗老化，推荐）/ hybrid / legacy_hsv（极端应急）
    lane_seg_mode: relative_border
    # 黄线检测模式：geometric_cv / yolo_cv_hybrid
    yellow_detect_mode: geometric_cv
    enable_semantic_hole_fill: true
    enable_obstacle_memory: true
    allow_dual_digit_cover: false
    # Tier 1 开关（DCBF 安全盾默认 false 供实车 A/B 对比测试）
    enable_cbf_shield: false
    enable_brake_adaptation: true
    enable_risk_aware_decision: true

    # B10：白道 CV 红障兜底（YOLO || CV，8类直替阶段主要靠它实时检测红锥与红禁行区）
    enable_cv_red_fallback: true
    red_h_low_1: 0
    red_h_high_1: 10
    red_h_low_2: 160
    red_h_high_2: 180
    red_s_min: 90
    red_v_min: 70
    red_cone_area_ratio_threshold: 0.0006

    # 基础控制（Run 1 稳健完赛 0.42 m/s，先保稳再在面板开直道提速；已按实测左+18.0°/右-21.4°锁死执行层）
    track_mode: fork
    target_speed: 0.42
    max_speed: 0.80
    min_speed: 0.0
    max_yaw_rate: 1.6
    speed_gain_damping: 0.45
    enable_clear_path_speed: false
    clear_straight_speed: 0.56
    clear_preview_dist_m: 0.95
    max_accel_mps2: 0.90
    max_decel_mps2: 2.00
    active_decel_kp: 0.0
    bev_wheelbase_m: 0.1395
    bev_kappa_max_left: 2.38
    bev_kappa_max_right: 2.80
    bev_control_latency_s: 0.15
    bev_imu_yaw_kp: 0.35
    bev_steer_launch_v_floor: 0.16
    bev_max_lat_accel_mps2: 0.42
    bev_memory_ttl_sec: 0.45
    bev_rollout_horizon_m: 0.85
    bev_lookahead_min_m: 0.28
    bev_lookahead_time_s: 0.65
    bev_curv_ff_gain: 0.55
    bev_stanley_k_y: 1.20
    enable_anti_stall_escape: true
    roi_top_ratio: 0.68
    roi_bottom_ratio: 0.18

    # ================================
    # 抗光照/抗老化相对分割 + 几何黄线 + 终点视觉封口
    # ================================
    gaussian_kernel: 5
    binary_threshold: 160.0
    morph_kernel: 3
    morph_iterations: 2
    min_contour_area: 2500.0
    invert_binary: false
    use_white_filter: true
    white_h_low: 0
    white_h_high: 180
    white_s_max: 45
    white_v_min: 80
    blue_margin: 22
    lab_blue_b_max: 116
    black_block_size: 31
    black_c_offset: 14.0
    black_v_max: 115
    lab_chroma_radius: 24.0
    lab_l_min_offset: 38.0
    hybrid_white_s_max: 75
    hybrid_white_v_min: 65
    semantic_hole_fill_dilate_px: 2

    # 车道几何与岔路双峰检测
    far_band_top_ratio: 0.28
    far_band_bottom_ratio: 0.48
    near_band_top_ratio: 0.55
    near_band_bottom_ratio: 0.80
    near_band_weight: 0.60
    far_band_weight: 0.40
    band_column_white_ratio: 0.40
    band_min_run_width: 18
    nominal_near_width_ratio: 0.68
    nominal_far_width_ratio: 0.48
    wide_road_ratio_threshold: 0.84
    wide_band_min_reliability: 0.18
    enable_width_adaptive_fusion: true
    wide_lane_boundary_blend: 0.45
    observation_filter_alpha: 0.85
    fork_min_gap_px: 14
    fork_min_branch_width_px: 18
    low_confidence_threshold: 0.55
    low_confidence_speed: 0.24
    low_confidence_yaw_hold: 0.80
    enable_continuous_curve_assist: true
    reverse_curve_min_error: 0.12
    reverse_curve_threshold: 0.35
    reverse_curve_confirm_frames: 3
    reverse_curve_clear_frames: 4

    # ================================
    # 黄线两段式零压线停稳 + FinishGuard（B1 独立黄线 ROI）
    # ================================
    use_yellow_filter: true
    yellow_roi_bottom_ratio: 0.0
    yellow_h_low: 16
    yellow_h_high: 42
    yellow_s_min: 52
    yellow_v_min: 48
    yellow_min_aspect_ratio: 2.5
    yellow_min_width_ratio: 0.20
    yellow_min_area_px: 120.0
    yellow_ahead_strip_height_px: 28
    yellow_dead_end_blue_ratio: 0.35
    yellow_dead_end_dark_ratio: 0.20
    yellow_dead_end_combined_ratio: 0.50
    yellow_stop_min_time: 0.55
    yellow_clear_frames: 10
    odom_still_threshold: 0.02
    odom_still_hold: 0.18
    odom_max_age_sec: 0.20
    yellow_require_odom_still: true
    yellow_max_hold_sec: 3.0
    # 死区穿越定值反拖急停（越过 ~0.09 m/s 电机死区，延长至 0.45s 越过实测 ~0.30s 底盘响应滞后）
    yellow_brake_speed: 0.24
    yellow_brake_period_s: 0.0
    yellow_brake_pulse_s: 0.0
    yellow_brake_release_speed: 0.06
    yellow_brake_max_time_s: 0.45

    # FinishGuard & 两段式刹车距离律（提前 0.85m 降到 0.18m/s 慢进急停区，杜绝 0.42m/s 满速冲线）
    odom_scale_factor: 1.0
    finish_min_dist_m: 6.5
    finish_force_dist_m: 11.5
    finish_min_cum_yaw_rad: 2.2
    yellow_pre_brake_dist_m: 0.85
    yellow_creep_speed_mps: 0.18
    yellow_final_ramp_dist_m: 0.35
    yellow_final_creep_speed_mps: 0.18
    yellow_brake_decel_mps2: 1.45
    voltage_decel_slope: 0.0
    yellow_control_latency_s: 0.09
    yellow_bumper_margin_m: 0.10
    yellow_rearm_dist_m: 0.25
    enable_sqrt_brake_envelope: true
    enable_closed_loop_brake: true
    brake_damping_gain: 0.85
    brake_min_cmd_mps: 0.20
    brake_zero_cutoff_mps: 0.04

    # ================================
    # GroundProjector (IPM 单应 / 针孔自动回退)
    # ================================
    use_homography: true
    homography_matrix: [-1.3985236e-05, 0.00074556476, -0.41829529, 0.0007049316, -2.6281263e-05, -0.21497408, -4.7978586e-06, -0.0063203042, 1.0]
    cam_height_m: 0.11
    cam_pitch_deg: 12.5
    focal_px: 325.0
    cam_cx: 320.0
    cam_cy: 240.0
    front_overhang_m: 0.06

    # ================================
    # ObstacleMemory & CorridorPlanner（B3 后轴中心修正 + B5 前瞻与错位双障）
    # ================================
    obstacle_merge_radius_m: 0.16
    obstacle_memory_ttl_sec: 1.8
    car_length_m: 0.280
    rear_axle_to_bumper_m: 0.18
    obstacle_rear_keep_margin_m: 0.15
    car_width_m: 0.191
    default_lane_width_m: 0.430
    border_margin_m: 0.025
    cone_margin_m: 0.025
    no_entry_margin_m: 0.035
    obstacle_lookahead_m: 1.10
    obstacle_rear_keep_m: 0.20
    obstacle_steer_horizon_m: 0.65
    obstacle_curve_min_horizon_m: 0.45
    obstacle_stagger_gap_m: 0.25
    obstacle_speed_mps: 0.26
    no_entry_speed_mps: 0.22
    blocked_creep_speed_mps: 0.12
    # 岔路 S 图：左侧为外道 (+3.0s 代价)，右为内道
    fork_outer_branch: -1
    fork_outer_time_penalty_s: 3.0
    fork_min_votes: 2
    fork_commit_dist_m: 1.10
    digit_min_conf: 0.35
    digit_min_frames: 2
    digit_lookahead_max_m: 1.15
    max_digit_lateral_shift_m: 0.12
    digit_approach_speed_mps: 0.30
    corridor_kp_y: 3.8
    corridor_heading_gain: 0.85

    # ================================
    # Tier 1: Ackermann 3-圆盘 DCBF 安全盾 & CRC 框底像素外扩（默认安全中性值）
    # ================================
    cbf_wheelbase_m: 0.142
    cbf_max_steer_deg: 35.0
    cbf_horizon_steps: 6
    cbf_step_dt_sec: 0.06
    cbf_gamma: 0.60
    crc_no_entry_pad_y_px: 0.0
    crc_cone_pad_y_px: 0.0
    crc_yellow_pad_y_px: 0.0

    # 丢线安全减速（防止盲跑冲出赛道触发 +15s/s 压线罚时）
    lost_line_safe_mode: true
    lost_line_safe_speed: 0.12
    lost_line_safe_stop_time: 0.35
    publish_debug_image: true

cmd_mux_node:
  ros__parameters:
    stop_topic: /cmd_vel_stop
    stop_timeout: 0.15
    low_topic: /cmd_vel_follower
    low_timeout: 0.35
    output_topic: /cmd_vel
    heartbeat_topic: /cmd_mux/heartbeat
    watchdog_rate_hz: 20.0

camera_publisher_node:
  ros__parameters:
    ae_awb_mode: lock_on_start
    power_line_frequency: 1
    backlight_compensation: 0
    exposure_dynamic_framerate: -1
    unlock_on_stop: true

bpu_yolov8_digit_node:
  ros__parameters:
    # 当前走 8 类数字直替路线（留空 "" 默认加载 8 类 out.list）；
    # 未来切换 11 类决赛模型时可改为 "src/yolov8/mod1/out_finals11.list"
    cls_list_path: ""
    conf_thresh: 0.25
    class_conf_overrides: "{}"
