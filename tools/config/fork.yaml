line_follower_node:
  ros__parameters:
    image_topic: /image_raw
    cmd_vel_topic: /cmd_vel_follower
    debug_image_topic: line_follower/debug_image
    line_state_topic: line_follower/track_state
    start_topic: line_follower/start_cmd
    stop_cmd_topic: /cmd_vel_stop
    line_centroid_topic: line_follower/centroid
    odom_topic: /odom
    target_speed: 0.50
    max_speed: 0.50
    min_speed: 0.0
    max_yaw_rate: 1.5
    kp: 3.30
    # 停稳即走：最少停 0.35s，且 odom 确认 |v|<0.02 持续 0.25s 才放行
    yellow_stop_min_time: 0.35
    odom_still_threshold: 0.02
    odom_still_hold: 0.25
    roi_top_ratio: 0.65
    roi_bottom_ratio: 0.2
    gaussian_kernel: 5
    binary_threshold: 160.0
    morph_kernel: 3
    morph_iterations: 2
    min_contour_area: 2500.0
    invert_binary: false
    use_white_filter: true
    white_h_low: 0
    white_h_high: 180
    white_s_max: 45
    white_v_min: 80
    use_yellow_filter: true
    yellow_h_low: 20
    yellow_h_high: 40
    yellow_s_min: 80
    yellow_v_min: 120
    yellow_area_ratio_threshold: 0.02
    yellow_stop_duration: 1.0
    yellow_permanent_count: 4
    yellow_clear_frames: 10
    enable_intersection_probe: false
    intersection_band_height: 50
    intersection_dark_ratio_threshold: 1.0
    intersection_turn_speed: 0.2
    intersection_turn_yaw_rate: 1.8
    intersection_turn_duration: 2.0
    intersection_cooldown: 2.0
    enable_continuous_curve_assist: true
    reverse_curve_min_error: 0.12
    reverse_curve_threshold: 0.35
    reverse_curve_confirm_frames: 3
    reverse_curve_clear_frames: 4
    reverse_curve_speed: 0.34
    sharp_curve_threshold: 0.5
    sharp_curve_speed: 0.41
    enable_red_filter: true
    red_h_low_1: 0
    red_h_high_1: 10
    red_h_low_2: 160
    red_h_high_2: 180
    red_s_min: 90
    red_v_min: 70
    red_area_ratio_threshold: 0.0035
    red_divider_angle_deg: 8.0
    red_vote_frames: 3
    red_turn_yaw: 0.4
    red_turn_linear: 0.3
    red_turn_duration: 0.2
    red_line_aspect_ratio_min: 3.0
    red_line_min_width_ratio: 0.3
    red_line_fallback_direction: -1
    red_line_soft_yaw: 0.35
    red_line_speed: 0.12
    red_cone_area_ratio_threshold: 0.0006
    red_cone_min_bbox_width: 4
    red_cone_min_bbox_height: 4
    enable_soft_red_avoidance: true
    red_soft_yaw: 0.15
    red_repulsion_gain: 1.5
    red_near_ratio: 0.38
    red_very_close_ratio: 0.72
    red_corridor_half_width_ratio: 0.35
    red_soft_curve_yaw_limit: 0.15
    red_lane_keep_min_factor: 0.4
    red_soft_speed: 0.25
    red_min_forward_speed: 0.15
    line_lost_stop_time: 0.8
    line_lost_forward_speed: 0.3
    line_lost_yaw_hold_factor: 0.85
    speed_gain_damping: 0.22
    publish_debug_image: true
detection_turn_controller:
  ros__parameters:
    detection_topic: hobot_dnn_detection
    state_topic: line_follower/track_state
    cmd_vel_topic: /cmd_vel_detection
    det_frame_width: 640
    det_frame_height: 480
    confidence_threshold: 0.1
    frame_window: 2
    turn_cooldown: 0.8
    turn_duration: 0.38
    turn_linear: 0.2
    yaw_gain: 1.6
    max_yaw_rate: 1.3
    turn_direction_sign: -1.0
    y_align_tolerance: 0.01
    line_centroid_topic: line_follower/centroid
    centroid_timeout: 0.5
cmd_mux_node:
  ros__parameters:
    stop_topic: /cmd_vel_stop
    stop_timeout: 0.5
    high_topic: /cmd_vel_detection
    high_timeout: 0.12
    low_topic: /cmd_vel_follower
    output_topic: /cmd_vel
    session_cooldown: 2.0
